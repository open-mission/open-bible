name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish"
        required: false
        type: string
      source_ref:
        description: "Git ref containing the build scripts and source"
        required: false
        type: string
      allow_unsigned:
        description: "Build unsigned installers for manual testing only"
        required: false
        default: false
        type: boolean
      rollback_tag:
        description: "Existing release tag to restore as the rollback target"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  UPDATE_CHANNEL: ${{ contains(inputs.release_tag || github.ref_name, '-') && 'beta' || 'latest' }}
  UNSIGNED_BUILD: ${{ inputs.allow_unsigned == true && github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'push' || inputs.release_tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            target: AppImage
            artifact: linux
            signing: none
          - name: macOS
            os: macos-14
            target: ""
            artifact: macos
            signing: macos
          - name: Windows
            os: windows-latest
            target: ""
            artifact: windows
            signing: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # The desktop build does not use server-side native dependencies such as
        # better-sqlite3, so do not run their install scripts on release runners.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          test "$release_version" != "$RELEASE_TAG" || { echo "Release tags must start with v"; exit 1; }
          RELEASE_VERSION="$release_version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"

          const expected = process.env.RELEASE_VERSION
          const manifests = [
            "package.json",
            "apps/web/package.json",
            "apps/desktop-tauri/package.json",
          ]

          for (const file of manifests) {
            const version = JSON.parse(readFileSync(file, "utf8")).version
            if (version !== expected) {
              throw new Error(`${file} has ${version}; expected ${expected}`)
            }
          }
          NODE
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Validate signing configuration
        if: matrix.signing != 'none' && env.UNSIGNED_BUILD != 'true'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.signing == 'windows' && secrets.ELECTRON_WINDOWS_CSC_LINK || secrets.ELECTRON_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'windows' && secrets.ELECTRON_WINDOWS_CSC_KEY_PASSWORD || secrets.ELECTRON_MACOS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$CSC_LINK" || { echo "Platform signing certificate is required"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Platform signing password is required"; exit 1; }

      - name: Build static Web renderer
        env:
          TAURI_BUILD: "1"
          NEXT_PUBLIC_API_ORIGIN: https://openbible-prod.vercel.app
          TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
          TURSO_AUTH_TOKEN: ci-placeholder-token
        run: pnpm --filter @open-bible/web build

      - name: Build Electron package
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          ELECTRON_BUILDER_TARGET: ${{ matrix.target }}
          ELECTRON_UPDATE_CHANNEL: ${{ env.UPDATE_CHANNEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.UNSIGNED_BUILD == 'true' && 'false' || 'true' }}
          CSC_LINK: ${{ matrix.signing == 'windows' && secrets.ELECTRON_WINDOWS_CSC_LINK || matrix.signing == 'macos' && secrets.ELECTRON_MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'windows' && secrets.ELECTRON_WINDOWS_CSC_KEY_PASSWORD || matrix.signing == 'macos' && secrets.ELECTRON_MACOS_CSC_KEY_PASSWORD || '' }}
        run: pnpm --filter @open-bible/desktop-tauri build

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.artifact }}
          path: |
            dist/electron/*.AppImage
            dist/electron/*.deb
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.exe
            dist/electron/*.yml
            dist/electron/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish after all targets pass
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/electron
          pattern: electron-*
          merge-multiple: true

      - name: Create release only after the matrix is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          release_title="Open Bible $RELEASE_TAG"
          if [[ "$UNSIGNED_BUILD" == "true" ]]; then
            release_title="$release_title (unsigned test build)"
          fi
          if [[ "$UPDATE_CHANNEL" == "beta" ]]; then
            gh release create "$RELEASE_TAG" --title "$release_title" --generate-notes --prerelease
          elif [[ "$UNSIGNED_BUILD" == "true" ]]; then
            gh release create "$RELEASE_TAG" --title "$release_title" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" --title "$release_title" --generate-notes
          fi

      - name: Upload all artifacts atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=()
          for artifact in dist/electron/*; do
            [[ -f "$artifact" ]] && artifacts+=("$artifact")
          done
          test "${#artifacts[@]}" -gt 0 || { echo "No Electron artifacts found"; exit 1; }
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber

  rollback:
    name: Validate rollback target
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Validate existing release without publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          gh release view "$ROLLBACK_TAG" --json tagName,name,isDraft,isPrerelease
          echo "Rollback target validated: $ROLLBACK_TAG"
          echo "Restore this release through the updater channel; do not delete or republish artifacts."
